<svg width="880" height="130" viewBox="0 0 880 130" fill="none" xmlns="http://www.w3.org/2000/svg" style="border-radius:42px; overflow:hidden;">

  <defs>

    <!-- Background glow -->
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(120 160) rotate(0) scale(500 250)">
      <stop offset="0%" stop-color="#2E2A8F" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0A0A14" stop-opacity="0"/>
    </radialGradient>

    <!-- 180 Gradient -->
    <linearGradient id="grad180" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Soft card glow -->
    <filter id="cardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Dark Background -->
  <rect width="880" height="130" fill="#070711"/>

  <!-- Ambient Glow -->
  <rect width="880" height="130" fill="url(#bgGlow)"/>

  <!-- Main Glass Card -->
  <rect
    width="880"
    height="130"
    rx="42"
    fill="rgba(255,255,255,0.015)"
    stroke="rgba(255,255,255,0.16)"
    stroke-width="5"
    filter="url(#cardGlow)"
  />

  <!-- IMMERSIVE -->
  <text
    x="50"
    y="85"
    fill="#F5F5F5"
    font-family="Times New Roman, serif"
    font-size="72"
    font-weight="300"
    letter-spacing="22"
  >
    IMMERSIVE
  </text>

  <!-- 180 -->
  <text
    x="680"
    y="85"
    fill="url(#grad180)"
    font-family="Times New Roman, serif"
    font-size="72"
    font-weight="400"
    letter-spacing="18"
  >
    180
  </text>

</svg>